<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-sm p-4 border-0" style="width: 100%; max-width: 420px;">
    <div class="text-center mb-4">
      <h4 class="fw-bold">Iniciar Sesión</h4>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger py-2 small">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Usuario</label>
        <input
          type="text"
          class="form-control"
          formControlName="username"
          [class.is-invalid]="isInvalid('username')"
          placeholder="tu_usuario">
        @if (isInvalid('username')) {
          <div class="invalid-feedback">
            Ingresa un usuario válido (mínimo 4 caracteres).
          </div>
        }
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Contraseña</label>
        <input
          type="password"
          class="form-control"
          formControlName="password"
          [class.is-invalid]="isInvalid('password')"
          placeholder="••••••••">
        @if (isInvalid('password')) {
          <div class="invalid-feedback">
            La contraseña debe tener al menos 4 caracteres
          </div>
        }
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-semibold mt-2" [disabled]="loading()">
        {{ loading() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
      </button>
    </form>
  </div>
</div>
